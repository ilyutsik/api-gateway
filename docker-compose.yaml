version: '3.9'

services:

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-superUltraSecretKeyYaProstoNeMogyNaSkolcoOnHoroshy}
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URI: http://user-service:8080
      ORDER_SERVICE_URI: http://order-service:8081
      AUTH_SERVICE_URI: http://auth-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8084
    ports:
      - "8088:8088"
    depends_on:
      - user-service
      - order-service
      - auth-service
      - payment-service
    networks:
      - microservices-network

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DB_HOST: user-service-db
      DB_PORT: 5432
      DB_NAME: ${USER_DB_NAME:-usersDB}
      DB_USERNAME: ${USER_DB_USERNAME:-ilyutsik}
      DB_PASSWORD: ${USER_DB_PASSWORD:-ilyutsik}
      REDIS_HOST: user-service-redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - user-service-db
      - user-service-redis
    networks:
      - microservices-network

  user-service-db:
    image: postgres:14
    container_name: user-service-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${USER_DB_USERNAME:-ilyutsik}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-ilyutsik}
      POSTGRES_DB: ${USER_DB_NAME:-usersDB}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  user-service-redis:
    image: redis:7
    container_name: user-service-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - user_redis_data:/data
    networks:
      - microservices-network

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      DB_HOST: order-service-db
      DB_PORT: 5432
      DB_NAME: ${ORDER_DB_NAME:-orderDB}
      DB_USERNAME: ${ORDER_DB_USERNAME:-ilyutsik}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-ilyutsik}
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URI: http://user-service:8080
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - order-service-db
    networks:
      - microservices-network

  order-service-db:
    image: postgres:14
    container_name: order-service-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${ORDER_DB_USERNAME:-ilyutsik}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-ilyutsik}
      POSTGRES_DB: ${ORDER_DB_NAME:-orderDB}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      DB_HOST: auth-service-db
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-usersAuth}
      DB_USERNAME: ${AUTH_DB_USERNAME:-ilyutsik}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-ilyutsik}
      JWT_SECRET: ${JWT_SECRET:-superUltraSecretKeyYaProstoNeMogyNaSkolcoOnHoroshy}
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URI: http://user-service:8080
      ORDER_SERVICE_URI: http://order-service:8081
    ports:
      - "8082:8082"
    depends_on:
      - auth-service-db
    networks:
      - microservices-network

  auth-service-db:
    image: postgres:14
    container_name: auth-service-db
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME:-ilyutsik}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-ilyutsik}
      POSTGRES_DB: ${AUTH_DB_NAME:-usersAuth}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_DB_URL: mongodb://payment-db:27017/payments_db
      RANDOM_API_URL: https://www.randomnumberapi.com
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - payment-db
    networks:
      - microservices-network

  payment-db:
    image: mongo:7
    container_name: payment-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: payments_db
    volumes:
      - mongo_data:/data/db
    networks:
      - microservices-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  user_postgres_data:
  user_redis_data:
  order_postgres_data:
  auth_postgres_data:
  mongo_data: